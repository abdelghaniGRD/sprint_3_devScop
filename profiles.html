<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Document</title>
  </head>
  <body class="bg-slate-900 h-[100vh] relative">
    <header
      class="flex items-center w-[80%] h-[50px] border-[2px] border-none rounded-[10px] ml-auto mr-auto mt-[20px] bg-slate-800 relative"
    >
      <div
        class="left text-white font-medium text-[20px] ml-[30px] before:bg-blue-600 before:rounded-[50%] before:w-[10px] before:h-[10px] before:border-[1px] before:absolute before:top-[20px] before:left-[15px]"
      >
        DevScope
      </div>
      <div class="right ml-auto">
        <a href="index.html" class="text-white font-medium mr-[10px]">
          Recherche
        </a>
        <a href="shortList.html" class="text-blue-500 font-medium mr-[20px]">
          Shortlist
        </a>
      </div>
    </header>
    <div
      class="p-[20px] rounded-[20px] focus:outline-none focus:ring-0 text-white bg-slate-800 relative z-[10] mt-[20px] w-fit ml-auto mr-auto"
    >
      <form method="GET">
        <input
          type="text"
          name="query"
          placeholder="Entrez un nom d'utilisateur ..."
          class="search rounded-[20px] w-[500px]"
        />
        <button
          type="submit"
          class="searchBtn text-white absolute p-[10px] border-[1px] rounded-[20px] w-[100px] right-[0px] top-[50%] -translate-y-1/2 z-999 bg-pink-400 cursor-pointer"
        >
          Cherche
        </button>
      </form>
    </div>
    <main class="flex gap-[20px] mt-[30px]">
      <aside
        class="profileParent text-white bg-slate-800 w-fit p-[20px] rounded-[10px] text-center"
      ></aside>
      <div class="mainContent text-white bg-slate-800 w-full p-[20px]">
        <h1>Depots 64</h1>
        <div class="reposList mt-[10px] flex gap-[10px] flex-wrap"></div>
      </div>
    </main>
  </body>
  <script type="module" src="/profiles-ui.js"></script>
</html>
